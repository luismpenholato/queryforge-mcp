name: Release npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - src/server.ts
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag, publish and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        run: node scripts/validate-release-version.mjs "${{ steps.version.outputs.tag }}"

      - name: Check existing release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "gh_release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "gh_release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if npm view "@luispenholato/queryforge-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "npm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stop when release is complete
        if: >-
          steps.state.outputs.npm_exists == 'true' &&
          steps.state.outputs.tag_exists == 'true' &&
          steps.state.outputs.gh_release_exists == 'true'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} is already complete on npm, git tag and GitHub Releases."

      - name: Setup Node.js
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14; npm >= 11.5.1 is installed only before publish.
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      - name: Install dependencies
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm ci

      - name: Run tests
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm test

      - name: Build package
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm run build

      - name: Validate public API
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm run validate:api

      - name: Pack npm tarball
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        id: pack
        shell: bash
        run: |
          PACK_OUTPUT="$(npm pack --json --ignore-scripts)"
          echo "$PACK_OUTPUT"

          PACK_FILE="$(node -e "
            const packs = JSON.parse(process.argv[1]);
            if (!Array.isArray(packs) || !packs[0]?.filename) {
              console.error('npm pack did not return a filename.');
              process.exit(1);
            }
            process.stdout.write(packs[0].filename);
          " "$PACK_OUTPUT")"

          echo "file=$PACK_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate npm tarball
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: node scripts/validate-package.mjs "${{ steps.pack.outputs.file }}"

      - name: Prepare OIDC publish auth
        if: steps.state.outputs.npm_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1. Upgrade only after tests/pack so
          # suite expectations for `npm pack --json` stay stable on the bundled CLI.
          npm install -g npm@11
          node -v
          npm -v

          # setup-node writes _authToken=${NODE_AUTH_TOKEN}; an empty value
          # blocks OIDC. Strip it so npm uses GitHub Actions trusted publishing.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          echo "Prepared npmrc for OIDC trusted publishing."

      - name: Publish to npm
        if: steps.state.outputs.npm_exists != 'true'
        run: npm publish "${{ steps.pack.outputs.file }}" --access public

      - name: Create tag
        if: steps.state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "QueryForge MCP ${{ steps.version.outputs.tag }}" \
            "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract release notes
        if: steps.state.outputs.gh_release_exists != 'true'
        run: node scripts/extract-changelog.mjs "${{ steps.version.outputs.tag }}" --output release-notes.md

      - name: Create GitHub Release
        if: steps.state.outputs.gh_release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QueryForge MCP ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.pack.outputs.file }}
