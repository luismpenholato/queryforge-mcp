name: Release npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - src/server.ts
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag, publish and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        run: node scripts/validate-release-version.mjs "${{ steps.version.outputs.tag }}"

      - name: Check existing release state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "gh_release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "gh_release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if npm view "@luispenholato/queryforge-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "npm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Stop when release is complete
        if: >-
          steps.state.outputs.npm_exists == 'true' &&
          steps.state.outputs.tag_exists == 'true' &&
          steps.state.outputs.gh_release_exists == 'true'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} is already complete on npm, git tag and GitHub Releases."

      - name: Setup Node.js
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      - name: Install dependencies
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm ci

      - name: Run tests
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm test

      - name: Build package
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm run build

      - name: Validate public API
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: npm run validate:api

      - name: Pack npm tarball
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        id: pack
        shell: bash
        run: |
          PACK_OUTPUT="$(npm pack --json --ignore-scripts)"
          echo "$PACK_OUTPUT"

          PACK_FILE="$(node -e "
            const packs = JSON.parse(process.argv[1]);
            if (!Array.isArray(packs) || !packs[0]?.filename) {
              console.error('npm pack did not return a filename.');
              process.exit(1);
            }
            process.stdout.write(packs[0].filename);
          " "$PACK_OUTPUT")"

          echo "file=$PACK_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate npm tarball
        if: >-
          steps.state.outputs.npm_exists != 'true' ||
          steps.state.outputs.tag_exists != 'true' ||
          steps.state.outputs.gh_release_exists != 'true'
        run: node scripts/validate-package.mjs "${{ steps.pack.outputs.file }}"

      - name: Ensure npm auth is configured
        if: steps.state.outputs.npm_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty. Create a classic Automation token (or granular token with publish) for @luispenholato/queryforge-mcp and set repository secret NPM_TOKEN."
            exit 1
          fi

          # Fail fast with a clearer message than npm's E404 for bad credentials.
          AUTH_CHECK="$(curl -sS -o /tmp/npm-whoami.json -w "%{http_code}" \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            https://registry.npmjs.org/-/whoami || true)"

          if [ "$AUTH_CHECK" != "200" ]; then
            echo "::error::NPM_TOKEN is invalid or expired (whoami HTTP $AUTH_CHECK). Update the repository secret NPM_TOKEN and re-run this workflow."
            cat /tmp/npm-whoami.json || true
            exit 1
          fi

          WHOAMI="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/npm-whoami.json','utf8')).username")"
          echo "Authenticated to npm as: $WHOAMI"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.state.outputs.npm_exists != 'true'
        run: npm publish "${{ steps.pack.outputs.file }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create tag
        if: steps.state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "QueryForge MCP ${{ steps.version.outputs.tag }}" \
            "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract release notes
        if: steps.state.outputs.gh_release_exists != 'true'
        run: node scripts/extract-changelog.mjs "${{ steps.version.outputs.tag }}" --output release-notes.md

      - name: Create GitHub Release
        if: steps.state.outputs.gh_release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QueryForge MCP ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.pack.outputs.file }}
